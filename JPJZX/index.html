<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集装箱竞拍模拟器</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 引导页 */
        .landing-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a2e 100%);
            position: relative;
            overflow: hidden;
        }

        .landing-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .landing-container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
        }

        .game-logo {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .game-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .game-subtitle {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 3rem;
        }

        .start-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .btn-start {
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 250px;
        }

        .btn-new-game {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
        }

        .btn-new-game:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(0, 255, 255, 0.6);
        }

        .btn-continue {
            background: linear-gradient(135deg, #ff00ff, #ff0088);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 255, 0.4);
        }

        .btn-continue:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(255, 0, 255, 0.6);
        }

        .btn-continue:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .game-features {
            display: flex;
            gap: 1.5rem;
            margin-top: 3rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }

        .feature-icon {
            font-size: 1.8rem;
        }

        .feature-text {
            font-size: 0.85rem;
            color: #aaa;
        }

        .version-info {
            position: absolute;
            bottom: 1.5rem;
            color: #555;
            font-size: 0.75rem;
        }

        /* 粒子 */
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 255, 0.6);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* 游戏页 */
        .game-page {
            display: none;
            min-height: 100vh;
            background: #0a0a1a;
        }

        .game-page.active {
            display: block;
        }

        .game-header {
            background: rgba(10, 10, 26, 0.95);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding: 0.6rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .header-logo {
            font-size: 1.3rem;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
            color: #00ffff;
        }

        .header-stats {
            display: flex;
            gap: 1.2rem;
        }

        .header-stat {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
        }

        .header-stat .value {
            font-weight: 600;
            color: #ffd700;
        }

        .header-actions {
            display: flex;
            gap: 0.4rem;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 240px 1fr 240px;
            gap: 0.8rem;
            padding: 0.8rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 作弊面板 */
        .cheat-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 50;
        }

        .cheat-toggle {
            background: rgba(255, 0, 0, 0.3);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff6666;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .cheat-toggle:hover {
            background: rgba(255, 0, 0, 0.5);
        }

        .cheat-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            right: 0;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 8px;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            min-width: 180px;
        }

        .cheat-menu.show {
            display: block;
        }

        .cheat-btn {
            display: block;
            width: 100%;
            padding: 0.4rem;
            margin-bottom: 0.3rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: left;
        }

        .cheat-btn:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .game-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 2rem;
            }

            .game-subtitle {
                font-size: 0.9rem;
            }

            .btn-start {
                padding: 0.8rem 2rem;
                font-size: 1rem;
                min-width: 200px;
            }

            .header-stats {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 引导页 -->
    <div class="landing-page" id="landingPage">
        <div class="particles" id="particles"></div>

        <div class="landing-container">
            <div class="game-logo">📦</div>
            <h1 class="game-title">集装箱竞拍模拟器</h1>
            <p class="game-subtitle">塔科夫搜刮版 · 81格网格搜刮体验</p>

            <div class="start-buttons">
                <button class="btn-start btn-new-game" onclick="startNewGame()">🎮 开始新游戏</button>
                <button class="btn-start btn-continue" id="continueBtn" onclick="continueGame()" disabled>📂 继续游戏</button>
            </div>

            <div class="game-features">
                <div class="feature-item">
                    <span class="feature-icon">🗺️</span>
                    <span class="feature-text">8张地图</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">📦</span>
                    <span class="feature-text">385种物品</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🤖</span>
                    <span class="feature-text">4个AI对手</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🎒</span>
                    <span class="feature-text">81格背包</span>
                </div>
            </div>
        </div>

        <div class="version-info">v2.0 · 纯静态游戏 · 数据保存在浏览器本地</div>
    </div>

    <!-- 游戏主页面 -->
    <div class="game-page" id="gamePage">
        <header class="game-header">
            <div class="header-left">
                <span class="header-logo">📦</span>
                <span class="header-title">集装箱竞拍模拟器</span>
            </div>
            <div class="header-stats">
                <div class="header-stat">💰 <span class="value" id="money">15000</span></div>
                <div class="header-stat">⭐ <span class="value" id="reputation">0</span></div>
                <div class="header-stat">📊 <span class="value" id="round">1/8</span></div>
            </div>
            <div class="header-actions">
                <button class="btn btn-small btn-info" onclick="saveGame()">💾 保存</button>
                <button class="btn btn-small btn-secondary" onclick="backToLanding()">🏠 返回</button>
            </div>
        </header>

        <div class="game-layout">
            <!-- 左侧 -->
            <aside class="sidebar">
                <div class="panel">
                    <h3 class="panel-title">🗺️ 选择地图</h3>
                    <div class="map-grid" id="mapSelector"></div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">🎒 背包 <span id="backpack-space">0/81</span></h3>
                    <div class="backpack-preview" id="backpackPreview"></div>
                    <a href="warehouse.html" class="btn btn-small btn-full" style="margin-top: 0.5rem;">管理仓库 →</a>
                </div>
            </aside>

            <!-- 中间 -->
            <main class="main-area">
                <div class="panel auction-section">
                    <div class="container-display">
                        <div class="container-icon">📦</div>
                        <p id="containerDesc">请先选择地图</p>
                    </div>

                    <div class="bid-display">¥<span id="currentBid">0</span></div>

                    <div class="auction-buttons">
                        <button class="btn btn-primary btn-large" id="startAuctionBtn" onclick="startAuction()">🎯 开始竞拍</button>
                        <button class="btn btn-success" id="bidBtn" onclick="playerBid()" disabled>💰 出价</button>
                        <button class="btn btn-danger" id="passBtn" onclick="playerPass()" disabled>🚫 放弃</button>
                    </div>

                    <div class="special-actions" id="specialActions" style="display: none;">
                        <button class="btn btn-special" onclick="specialAction('scout')">🔍 侦察 (500)</button>
                        <button class="btn btn-special" onclick="specialAction('suppress')">📉 压价 (800)</button>
                        <button class="btn btn-special" onclick="specialAction('interfere')">👊 干扰 (1000)</button>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">📜 战斗日志</h3>
                    <div class="log-content" id="gameLog">
                        <p class="log-entry">欢迎来到集装箱竞拍模拟器！</p>
                    </div>
                </div>
            </main>

            <!-- 右侧 -->
            <aside class="sidebar">
                <div class="panel">
                    <h3 class="panel-title">🤖 对手</h3>
                    <div class="ai-list" id="aiPlayers"></div>
                </div>

                <div class="panel">
                    <h3 class="panel-title">🏪 快捷入口</h3>
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <a href="warehouse.html" class="btn btn-small btn-full">📦 仓库</a>
                        <a href="shop.html" class="btn btn-small btn-full">🏪 商店</a>
                        <a href="synthesis.html" class="btn btn-small btn-full">⚗️ 合成</a>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 作弊面板 -->
        <div class="cheat-panel">
            <div class="cheat-menu" id="cheatMenu">
                <button class="cheat-btn" onclick="cheatAddMoney(10000)">+💰 10000</button>
                <button class="cheat-btn" onclick="cheatAddMoney(50000)">+💰 50000</button>
                <button class="cheat-btn" onclick="cheatAddMoney(999999)">+💰 999999</button>
                <button class="cheat-btn" onclick="cheatAddReputation(100)">+⭐ 100 声望</button>
                <button class="cheat-btn" onclick="cheatSkipRound()">⏭️ 跳过回合</button>
                <button class="cheat-btn" onclick="cheatClearSave()">🗑️ 清除存档</button>
            </div>
            <button class="cheat-toggle" onclick="toggleCheatMenu()">🎮 作弊</button>
        </div>
    </div>

    <!-- 搜刮模态框 -->
    <div class="modal" id="lootModal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>🔍 搜刮战利品</h3>
                <button class="modal-close" onclick="closeModal('lootModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="loot-stats">
                    <span>发现: <span id="lootFound">0</span>/<span id="lootTotal">0</span></span>
                    <span>价值: ¥<span id="lootValue">0</span></span>
                </div>
                <div class="loot-grid" id="lootGrid"></div>
                <div style="text-align: center; margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="finishLooting()">✅ 完成搜刮</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 随机事件模态框 -->
    <div class="modal" id="eventModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="eventTitle">事件</h3>
                <button class="modal-close" onclick="closeModal('eventModal')">✕</button>
            </div>
            <div class="modal-body">
                <p id="eventDesc" style="margin-bottom: 1rem;"></p>
                <div id="eventOptions" class="event-options"></div>
            </div>
        </div>
    </div>

    <!-- 游戏结束模态框 -->
    <div class="modal" id="gameOverModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🏆 游戏结束</h3>
            </div>
            <div class="modal-body">
                <div id="gameOverStats"></div>
                <button class="btn btn-primary btn-full" onclick="backToLanding()" style="margin-top: 1rem;">返回主页</button>
            </div>
        </div>
    </div>

    <script src="items.js"></script>
    <script src="grid.js"></script>
    <script src="state.js"></script>
    <script src="ui.js"></script>
    <script src="game.js"></script>
    <script>
        // 全局游戏实例
        let gameInstance = null;

        // 创建粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 10 + 10) + 's';
                p.style.animationDelay = Math.random() * 10 + 's';
                p.style.background = `hsl(${Math.random() * 60 + 160}, 100%, 70%)`;
                container.appendChild(p);
            }
        }

        // 检查存档
        function checkSaveData() {
            const data = localStorage.getItem('containerAuctionSave');
            document.getElementById('continueBtn').disabled = !data;
        }

        // 开始新游戏
        function startNewGame() {
            localStorage.removeItem('containerAuctionSave');
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('gamePage').classList.add('active');
            initGame();
        }

        // 继续游戏
        function continueGame() {
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('gamePage').classList.add('active');
            initGame();
            gameInstance.loadGame();
        }

        // 初始化游戏
        function initGame() {
            gameInstance = new Game();
            window.game = gameInstance;
        }

        // 返回主页
        function backToLanding() {
            document.getElementById('gamePage').classList.remove('active');
            document.getElementById('landingPage').style.display = 'flex';
            checkSaveData();
        }

        // 保存游戏
        function saveGame() {
            if (gameInstance) {
                GameState.save();
                ui.showToast('💾 游戏已保存！');
            }
        }

        // 地图选择
        function selectMap(index) {
            GameState.update({ selectedMap: index });
            renderMaps();
            const map = MAPS[index];
            document.getElementById('containerDesc').textContent = `🗺️ ${map.name} | 难度: ${'⭐'.repeat(map.difficulty)} | 掉落: ${map.dropRate}%`;
            ui.addLog(`选择了地图: ${map.name}`);
        }

        // 渲染地图
        function renderMaps() {
            ui.renderMapSelector(MAPS, GameState.data.selectedMap, selectMap);
        }

        // 开始竞拍
        function startAuction() {
            if (GameState.data.selectedMap === null) {
                ui.showToast('请先选择地图！');
                return;
            }
            if (gameInstance) gameInstance.startAuction();
        }

        // 出价
        function playerBid() {
            if (gameInstance) gameInstance.playerBid();
        }

        // 放弃
        function playerPass() {
            if (gameInstance) gameInstance.playerPass();
        }

        // 特殊行动
        function specialAction(type) {
            if (gameInstance) gameInstance.specialAction(type);
        }

        // 完成搜刮
        function finishLooting() {
            if (gameInstance) {
                gameInstance.addItemsToInventory();
                closeModal('lootModal');
            }
        }

        // 关闭模态框
        function closeModal(id) {
            ui.closeModal(id);
        }

        // 作弊功能
        function toggleCheatMenu() {
            document.getElementById('cheatMenu').classList.toggle('show');
        }

        function cheatAddMoney(amount) {
            GameState.update({ money: GameState.data.money + amount });
            ui.showToast(`💰 +${amount}`);
            ui.addLog(`作弊: +${amount} 金钱`);
        }

        function cheatAddReputation(amount) {
            GameState.update({ reputation: GameState.data.reputation + amount });
            ui.showToast(`⭐ +${amount} 声望`);
        }

        function cheatSkipRound() {
            if (GameState.data.round < 8) {
                GameState.update({ round: GameState.data.round + 1 });
                ui.showToast(`⏭️ 跳到第 ${GameState.data.round} 回合`);
            } else {
                if (gameInstance) gameInstance.endGame();
            }
        }

        function cheatClearSave() {
            if (confirm('确定清除存档？')) {
                localStorage.removeItem('containerAuctionSave');
                location.reload();
            }
        }

        // 点击外部关闭作弊菜单
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.cheat-panel')) {
                document.getElementById('cheatMenu').classList.remove('show');
            }
        });

        // 初始化
        createParticles();
        checkSaveData();
    </script>
</body>
</html>
